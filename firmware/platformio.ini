; AirSense firmware
;
; env:seeed_xiao_esp32c3 — Phase-2 prototype (XIAO + SCD41 + BLE), unchanged
; env:airsense_v4        — v4 (rev B) board: ESP32-C3-WROOM-02, full sensor
;                          stack + cadence scheduler (ticket 05)

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_port = COM8
monitor_port = COM8
build_src_filter = +<*> -<v4/>
lib_deps =
    sensirion/Sensirion I2C SCD4x@^0.4.0
    sensirion/Sensirion Gas Index Algorithm@^3.2.1
    sensirion/Sensirion I2C SGP41@^1.0.0
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5

[env:airsense_v4]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<v4/>
lib_deps =
    sensirion/Sensirion I2C SCD4x@^0.4.0
    sensirion/Sensirion Gas Index Algorithm@^3.2.1
    sensirion/Sensirion I2C SGP41@^1.0.0
    sensirion/Sensirion I2C SEN5X@^0.3.0
    adafruit/Adafruit BMP3XX Library@^2.1.2
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
